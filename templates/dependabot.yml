version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    # The shared workflows move through the v1 tag, which is updated by hand.
    ignore:
      - dependency-name: "jishnuteegala/.github*"
    groups:
      actions:
        patterns:
          - "*"
