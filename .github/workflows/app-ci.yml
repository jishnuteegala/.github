name: App CI

on:
  workflow_call:
    inputs:
      os:
        description: JSON array of runner images for the check matrix.
        required: false
        type: string
        default: '["ubuntu-latest"]'
      node-version:
        description: Node.js version for the check matrix.
        required: false
        type: string
        default: "24"
      pre-check:
        description: Bash commands run after dependency install, before the check.
        required: false
        type: string
        default: ""
      post-check:
        description: Bash commands run after the check, on the Linux runner only.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  conventional-commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate commit subjects
        uses: jishnuteegala/.github/actions/conventional-commits@v1

  check:
    name: App checks
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare checks
        if: inputs.pre-check != ''
        shell: bash
        run: ${{ inputs.pre-check }}

      - name: Check app
        run: pnpm check

      - name: Run extra checks
        if: inputs.post-check != '' && runner.os == 'Linux'
        shell: bash
        run: ${{ inputs.post-check }}
